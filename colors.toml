mode = "dark"

# A night camp in the pines. The grounds are the blue-black of the forest
# canopy (#141C24 in the art); the accent is the campfire's amber, and the
# foreground is the lamplit canvas of the tents. Blues come from the dusk sky
# between the trees, magenta from the wildflowers on the left bank, green from
# the moss in the clearing.

